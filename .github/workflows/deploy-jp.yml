name: Deploy Agent Server (JP)

on:
  push:
    branches: [jp_model_lake_adapt]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, jp]
    steps:
      - name: Deploy Agent Server JP
        run: |
          set -e
          cd ${{ secrets.JP_DEPLOY_PATH }}/folio-agent-server
          # 同 deploy.yml：env 文件先于构建校验（model_lake 的 key 也要先填好）
          test -f .env.jp || { echo "❌ .env.jp 缺失，先写好 scp 上来再跑"; exit 1; }
          git pull origin jp_model_lake_adapt
          docker compose -f docker-compose.jp.yml up -d --build
          docker image prune -f
          echo "✅ Agent Server JP deployed at $(date)"
