# folio agent-server 配置文件
# 认证信息不放这里，走环境变量（见 env.example）

# ==================== 数据库配置（MySQL 会话元信息 + MongoDB 消息正文，与 AKS 双库分工一致） ====================

# MongoDB 文档数据库配置（会话消息正文存储）
[mongodb]
# host 由环境变量 MONGODB_HOST 提供（dev: 192.168.201.14 / prod: 容器名）
# 数据库名称由环境变量 MONGODB_DATABASE 提供（dev: dev_default / prod: default）
port = 27017
connect_timeout_ms = 5000
server_selection_timeout_ms = 5000
# 连接池配置
max_pool_size = 50
min_pool_size = 10

# MySQL 关系数据库配置（agent_session 会话元信息；消息正文在 MongoDB）
[mysql]
# host / database 由环境变量 MYSQL_HOST / MYSQL_DATABASE 提供（必填注入）
port = 3306
# 字符集
charset = "utf8mb4"
# 连接池配置
pool_size = 10
max_overflow = 20
pool_timeout = 30
pool_recycle = 3600
# 是否显示SQL语句
echo = false

# Redis 缓存配置
[redis]
# 模式选择：standalone（单机）或 cluster（集群）
mode = "standalone"

# host 由环境变量 REDIS_HOST 提供；db 编号由 REDIS_DB 提供（dev/prod 实例隔离）
port = 6379
max_connections = 50        # 连接池最大连接数
socket_timeout = 5.0        # Socket 超时时间（秒）
socket_connect_timeout = 5.0  # Socket 超时时间（秒）
decode_responses = true     # 是否自动解码为字符串
encoding = "utf-8"          # 字符编码

# 业务配置（可选）
key_prefix = "agent_apps:"  # 全局键前缀
default_expire = 3600       # 默认过期时间（秒）

# ==================== 沙箱配置（ADR-0001 资源硬限制） ====================

[sandbox]
# 单次调用 fuel 上限（Wasmtime 确定性指令计量，1e8 = 默认值）
fuel_per_call = 1000000000
# 单次调用墙钟超时（毫秒），超时 kill store
wall_clock_timeout_ms = 10000
# Store 内存上限（MiB），含内存 FS
memory_limit_mb = 64
# 输出（stdout + 返回值）截断上限（MiB）
output_limit_mb = 1
# 单用户并发执行槽
max_concurrency_per_user = 2
# sidecar 进程池初始大小
sidecar_pool_size = 2
# sidecar 连续失败自杀阈值（次）
sidecar_max_failures = 3
# Pyodide Node 孙进程墙钟（毫秒，应高于外层 wall_clock_timeout_ms）
node_runner_timeout_ms = 15000
# http_fetch 单请求体大小上限（MiB）
http_fetch_max_body_mb = 5
# http_fetch 每日次数配额（per-agent）
http_fetch_daily_quota = 1000

# ==================== 系统配置 ====================

# 日志配置
[logging]
# 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = "INFO"
# 日志文件路径
log_dir = "logs"
# 日志文件名
log_file = "dev.log"
# 单个日志文件最大大小（MB）
max_bytes = 100
# 保留的日志文件数量
backup_count = 10

# ==================== 会话附件工作空间（docs/会话附件与工作空间设计.md） ====================

# 对象存储（D17：同实例新桶，与 AKS 桶隔离）
[storage]
type = "minio"

[minio]
# endpoint / access_key / secret_key 由环境变量 MINIO_ENDPOINT / MINIO_ACCESS_KEY / MINIO_SECRET_KEY 提供
secure = false
region = "us-east-1"

# MinerU 文档解析（D3：共用 AKS 侧实例，本服务自持薄客户端直连）
[mineru]
# api_url 由环境变量 MINERU_API_URL 提供
timeout = 600          # 任务总超时（秒）
poll_interval = 1.0    # 轮询间隔（秒）

# 工作空间业务参数（硬限制 D10 / 清理 D9、D11）
[workspace]
upload_max_file_mb = 50            # 单文件上限
upload_max_files_per_session = 20  # 单会话附件数上限
cleanup_hour = 3                   # 清理任务每日执行时刻（本地时区）
upload_retention_days = 30         # 软删会话后 upload 附件保留天数
agent_retention_days = 7           # 软删会话后 agent 产物保留天数
temp_retention_hours = 24          # 临时区未绑定回收（D11）
failed_parse_retention_days = 7    # 解析失败行保留天数
cleanup_batch_size = 500           # 单次清理对象数上限（防 IO 突刺）

# 沙箱工作空间读写闭环（§3.3；预载现在生效，drain/files_out 为二期）
[sandbox.workspace]
preload_max_files = 20
preload_max_total_mb = 32
drain_max_files = 10
drain_max_single_mb = 10
drain_max_total_mb = 20
session_total_quota_mb = 500
agent_subquota_mb = 200
